name: Build ATHENA Android (APK e AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Injetar google-services.json (secret CI)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON ausente. Não versionar google-services.json no Git."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Compilar Aplicação Web (Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Secret VITE_API_URL ausente. O APK precisa da URL HTTPS do proxy (sem chave Gemini)."
            exit 1
          fi
          npm run build

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Permissão de Execução para o Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK de Teste (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Compilar AAB para Google Play (Release Bundle)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Disponibilizar APK de Teste para Download
        uses: actions/upload-artifact@v4
        with:
          name: ATHENA-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Disponibilizar AAB (Google Play) para Download
        uses: actions/upload-artifact@v4
        with:
          name: ATHENA-app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
